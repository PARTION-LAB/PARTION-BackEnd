spring.application.name=partion

server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.partion.matching.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.partion.matching.event.TradeExecutedEvent

partion.matching.kafka.enabled=${PARTION_MATCHING_KAFKA_ENABLED:true}

oauth.naver.client-id=${OAUTH_NAVER_CLIENT_ID:}
oauth.naver.client-secret=${OAUTH_NAVER_CLIENT_SECRET:}
oauth.naver.redirect-uri=${OAUTH_NAVER_REDIRECT_URI:}

oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.google.redirect-uri=${OAUTH_GOOGLE_REDIRECT_URI:}

oauth.kakao.client-id=${OAUTH_KAKAO_CLIENT_ID:}
oauth.kakao.client-secret=${OAUTH_KAKAO_CLIENT_SECRET:}
oauth.kakao.redirect-uri=${OAUTH_KAKAO_REDIRECT_URI:}