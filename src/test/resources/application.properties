spring.application.name=partion-test

spring.datasource.url=jdbc:h2:mem:partion_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never

toss.secret-key=test_sk_dummy

aws.region=ap-northeast-2
aws.s3.bucket=test-bucket
aws.access-key-id=test-access-key
aws.secret-access-key=test-secret-key

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.backend-base-url=http://localhost:8080
app.frontend-base-url=http://localhost:5173

spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

spring.ai.openai.api-key=test-openai-api-key
spring.ai.openai.chat.model=gpt-5-mini
spring.ai.openai.chat.temperature=0.3